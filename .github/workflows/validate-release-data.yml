# Checks the files in release-data/ (the tarball hashes, the daemon image digests and the signing key
# fingerprints) against their schemas and against the format that the writer scripts use. The other pull
# request workflows ignore release-data/**, so this is the only check that runs on a change to it. See
# release-data/validate.py for what is checked.

name: validate-release-data

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'release-data/**'
      - '.github/workflows/validate-release-data.yml'
  pull_request:
    paths:
      - 'release-data/**'
      - '.github/workflows/validate-release-data.yml'

jobs:
  validate:
    name: Validate release-data
    runs-on: ubuntu-latest
    permissions:
      contents: read    # This is required for actions/checkout
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          sparse-checkout: release-data
          persist-credentials: false
      - name: Install the JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'jsonschema==4.23.0'
      - name: Test the validator
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s release-data/tests'
      - name: Validate the files
        run: '"$RUNNER_TEMP/venv/bin/python" release-data/validate.py release-data'
