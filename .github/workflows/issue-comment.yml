name: issue-comment
permissions: {}

on:
  workflow_call:
    inputs:
      issue-number:
        type: number
        required: true
      message:
        type: string
        required: true
    secrets:
      token:
        required: true

jobs:
  post-comment:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.token }}
    steps:
      - name: respond to issue
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          MESSAGE: ${{ inputs.message }}
        run: |
          gh issue -R "$REPO" comment "$ISSUE_NUMBER" --body "$MESSAGE"
